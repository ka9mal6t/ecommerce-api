version: "3.7"
services:
  db:
    image: postgres:16
    container_name: ecommerce_db
    env_file:
      - .env
    ports:
      - "5432:5432"

  ecommerce:
    build:
      context: .
    container_name: ecommerce_app
    env_file:
      - .env
    depends_on:
      - db
    command: ["/ecommerce/docker/app.sh"]
    ports:
      - "8000:8000"


